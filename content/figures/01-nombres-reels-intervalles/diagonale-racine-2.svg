<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="Arial, Helvetica, sans-serif"><title>Carré de côté 1 posé sur la droite numérique entre 0 et 1 ; sa diagonale mesure √2 ; un arc de cercle de centre 0 la reporte sur la droite au point d’abscisse √2, environ 1,414</title><rect width="620" height="300" fill="white"/><line x1="56.8" y1="240" x2="563" y2="240" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><polygon points="572,240 563,244.1 563,235.9" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/><line x1="150" y1="233" x2="150" y2="247" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="150" y="265" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">0</text><line x1="310" y1="233" x2="310" y2="247" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="310" y="265" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">1</text><line x1="470" y1="233" x2="470" y2="247" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="470" y="265" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">2</text><polygon points="150,240 310,240 310,80 150,80" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/><line x1="150" y1="240" x2="310" y2="80" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><path d="M310,80 A226.3,226.3 0 0 1 376.3,240" fill="none" stroke="#1f4e79" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="376.3" cy="240" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="380.3" y="226" font-size="18" fill="#c0392b" text-anchor="start" font-weight="bold">√2</text><text x="376.3" y="286" font-size="14" fill="#666" text-anchor="middle" font-weight="normal">≈ 1,414</text><text x="214" y="152" font-size="17" fill="#c0392b" text-anchor="end" font-weight="bold">√2</text><text x="322" y="165" font-size="15" fill="#222" text-anchor="start" font-weight="normal">1</text><text x="230" y="70" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">1</text><polyline points="296,240 296,226 310,226" fill="none" stroke="#222" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="30" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Pythagore : diagonale² = 1² + 1² = 2</text><text x="330" y="52" font-size="15" fill="#222" text-anchor="start" font-weight="normal">donc diagonale = √2</text><text x="330" y="80" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="normal">Le compas reporte la diagonale</text><text x="330" y="98" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="normal">sur la droite numérique.</text></svg>