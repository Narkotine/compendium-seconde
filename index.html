<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maths Seconde</title>
  <meta name="description" content="Cours de maths de seconde (programme 2026) : chapitres avec figures, exercices et corrigés. Fonctionne hors ligne." />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Maths Seconde" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    // Thème appliqué avant le premier rendu (pas de flash). Clé préfixée : origine partagée avec d'autres sites.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('compendium-seconde.settings') || '{}');
        var t = s.theme || 'auto', d = document.documentElement;
        d.dataset.theme = t;
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name=theme-color]').content = dark ? '#17161b' : '#f7f6f2';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><p class="boot" role="status">Chargement…</p></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:1rem">Cette application a besoin de JavaScript pour afficher les cours.</p></noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
